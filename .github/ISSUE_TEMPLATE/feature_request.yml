name: Feature or new data source
description: Suggest an improvement, an API source or an eval task
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this make possible
      description: The question an agent can't answer today, or the problem you hit.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed change
      description: For a new source, link its API docs and say whether it needs a key.
