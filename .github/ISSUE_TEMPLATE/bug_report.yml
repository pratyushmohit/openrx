name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Commands, the question asked, or the code passed to `search` / `execute`.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output or logs
      render: text
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Python version, Floci version, model (if the agent is involved)
