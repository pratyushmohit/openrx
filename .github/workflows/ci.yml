# Runs `make check` (lint, catalog lint, type check, unit tests) on every push and PR.
# Integration tests need Floci, Lambdas and Ollama, so they run locally only
# (`make test-integration`); CI covers everything that doesn't.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python and dependencies (from uv.lock)
        run: uv sync --locked
      - name: make check
        run: make check
