[project]
name = "openrx"
version = "0.1.0"
description = "MCP server with sandboxed code execution (search + execute) for public FDA/NIH drug data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.119",
    "fastmcp>=4.1.4",
    "httpx>=0.28.1",
    "langchain-aws>=1.9.1",
    "langchain-mcp-adapters>=0.3.1",
    "langgraph>=1.2.18",
    "pydantic>=2.14.1",
    "pydantic-monty>=1.4.0",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]
evals = [
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "tiktoken>=0.14.0",
]

[project.scripts]
# `openrx` command -> the Typer app in src/openrx/cli.py
openrx = "openrx.cli:app"

[build-system]
# uv's own build backend; finds the package in src/openrx by default (D-008).
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/W/F: pycodestyle + pyflakes; I: import order; B: likely bugs;
# UP: modern syntax; D: docstrings, checked against the Google style guide.
select = ["E", "W", "F", "I", "B", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names describe the behaviour; docstrings there add little.
"tests/**" = ["D"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib: test files in different folders may share a name without clashing.
# Integration tests need Floci and deployed Lambdas: `make test-integration`.
addopts = ["--strict-markers", "--import-mode=importlib", "-m", "not integration"]
markers = ["integration: needs Floci running with the Lambdas deployed (make up && make deploy)"]
# Lets tests import shared sample data from tests/samples.py.
pythonpath = ["tests"]

[tool.coverage.run]
source = ["openrx"]
branch = true
