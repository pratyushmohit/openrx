# Local AWS emulator for OpenRx. Start with `docker compose up -d`.
services:
  floci:
    # Pinned version (not :latest) so everyone gets the same emulator behaviour.
    image: floci/floci:2.3.0
    ports:
      - "4566:4566"
    environment:
      # Bedrock Runtime: forward Converse calls to Ollama on the host instead
      # of returning a canned stub reply. Floci runs in a container, so the
      # host's Ollama is reachable at host.docker.internal, not localhost.
      FLOCI_SERVICES_BEDROCK_RUNTIME_BACKEND: proxy
      FLOCI_SERVICES_BEDROCK_RUNTIME_PROXY_URL: http://host.docker.internal:11434/v1
      FLOCI_SERVICES_BEDROCK_RUNTIME_PROXY_DEFAULT_MODEL: ${OLLAMA_MODEL:-qwen3.5:latest}
      # Lambda: Floci runs each function in its own Docker container. Those
      # containers join the "openrx" network and reach Floci (to fetch events
      # and post results) by the hostname "floci".
      FLOCI_HOSTNAME: floci
      FLOCI_SERVICES_LAMBDA_DOCKER_NETWORK: openrx
      # Enforce IAM policies, like real AWS (Floci allows everything by
      # default). Without it, a missing or wrong permission would only show
      # up on real AWS (D-007).
      FLOCI_SERVICES_IAM_ENFORCEMENT_ENABLED: "true"
    extra_hosts:
      # Docker Desktop defines host.docker.internal already; this makes it work
      # on plain Linux Docker too.
      - "host.docker.internal:host-gateway"
    volumes:
      # Docker's control socket, so Floci can start Lambda containers.
      # Security: whoever holds this socket controls Docker on this machine.
      # Acceptable for a local emulator we run ourselves; never do this with
      # an untrusted image.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - openrx
    # No data volume on purpose: Floci keeps state in memory, so recreating
    # the container starts from an empty AWS account. See `make up`.

  # Optional web console for browsing emulated resources (http://localhost:4500).
  # Off by default; start it with `docker compose --profile ui up -d`.
  floci-ui:
    image: floci/floci-ui:0.7.0
    profiles: ["ui"]
    ports:
      - "4500:4500"
    environment:
      # Containers on the same compose network reach each other by service name.
      FLOCI_ENDPOINT: http://floci:4566
    depends_on:
      - floci
    networks:
      - openrx

networks:
  openrx:
    # Fixed name (compose would otherwise call it "openrx_default") because
    # Floci needs the exact name to attach Lambda containers to it.
    name: openrx
